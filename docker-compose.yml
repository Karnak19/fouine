services:
  fouine:
    build: .
    image: fouine:latest
    restart: unless-stopped
    # Don't start until the sidecar answers its healthcheck, so the first review
    # isn't racing a server that isn't listening yet.
    depends_on:
      opencode:
        condition: service_healthy
    # Same liveness check as compose.coolify.yml — see the comment there.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Mounted at the SAME absolute path in both containers: session.create's
      # location.directory is a /data/... path the sidecar resolves itself.
      - ./data:/data
    environment:
      DATA_DIR: /data
      PORT: 3000
      # Sidecar mode: set = fouine spawns no opencode child and talks to the
      # service below instead. Unset this to fall back to child mode (fouine
      # spawns its own `opencode serve`; needs the opencode CLI on PATH, which
      # the root Dockerfile installs).
      OPENCODE_BASE_URL: http://opencode:4096
      # Shared with the sidecar. Basic auth username is always "opencode".
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-opencode-go/deepseek-v4-flash}
      OPENCODE_CHAT_MODEL: ${OPENCODE_CHAT_MODEL:-opencode-go/deepseek-v4.1-flash}
      # Z.ai GLM Coding Plan key — only needed for zai-coding-plan/* models.
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      # Command Code key — only needed for commandcode/* models.
      COMMANDCODE_API_KEY: ${COMMANDCODE_API_KEY:-}
      # Langfuse tracing (opt-in) — only affects opencode.json generation here;
      # in sidecar mode the plugin actually RUNS in the opencode service below,
      # so it needs the same vars (see its environment block).
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASEURL: ${LANGFUSE_BASEURL:-}
      LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-}
      LANGFUSE_USER_ID: ${LANGFUSE_USER_ID:-}

  # The OpenCode server, as its own container. Only fouine publishes a host
  # port; this one is reachable on the compose network only.
  opencode:
    build:
      context: .
      dockerfile: Dockerfile.opencode
    image: fouine-opencode:latest
    restart: unless-stopped
    expose:
      - "4096"
    volumes:
      # MUST be the same absolute path as fouine's (see above).
      - ./data:/data
    environment:
      # Only what the server and the review's tools need. NO fouine secrets:
      # the model can read its shell env, and these secrets would leak into every
      # bash call. FOUINE_INTERNAL_URL is how the post_* tools reach fouine.
      HOME: /root
      OPENCODE_CONFIG_DIR: /data/opencode
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      FOUINE_INTERNAL_URL: http://fouine:3000
      # Non-secret opencode-side knob read by the cap-bash-timeout plugin. Child
      # mode forwards the same var via review/opencode.ts's PASSTHROUGH_ENV; the
      # sidecar needs it here for parity. Empty = the plugin's built-in default.
      OPENCODE_BASH_TIMEOUT_MAX_MS: ${OPENCODE_BASH_TIMEOUT_MAX_MS:-}
      # Langfuse tracing (opt-in): unlike OPENCODE_BASH_TIMEOUT_MAX_MS above,
      # LANGFUSE_SECRET_KEY IS a credential — the opencode server (and anything
      # it shells out to) can read it. Same tradeoff as child mode's
      # PASSTHROUGH_ENV in review/opencode.ts: use a dedicated, trace-only
      # Langfuse project/key. Both keys empty = the plugin fouine declares in
      # opencode.json (see skills/materialize.ts) is absent too, so this is a
      # true no-op when unset. The sidecar needs outbound access to npm (to
      # fetch the plugin) and to LANGFUSE_BASEURL (or the Langfuse cloud
      # default) to actually ship traces.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASEURL: ${LANGFUSE_BASEURL:-}
      LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-}
      LANGFUSE_USER_ID: ${LANGFUSE_USER_ID:-}
    # The official image has ENTRYPOINT ["opencode"] and no CMD.
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    healthcheck:
      # /api/info requires Basic auth once OPENCODE_SERVER_PASSWORD is set
      # (verified against 2.0.11), and the image has busybox wget + base64 but no
      # curl, so the header is built by hand. `$$` lets the container's shell —
      # not Compose — expand the password.
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          --header="Authorization: Basic $(printf 'opencode:%s' "$$OPENCODE_SERVER_PASSWORD" | base64)"
          http://127.0.0.1:4096/api/info
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
 (OpenCode v1 → v2 migration: singleton server, loopback-proxy GitHub, plugin API)
