services:
  fouine:
    build: .
    image: fouine:latest
    restart: unless-stopped
    # Same liveness check as compose.coolify.yml — see the comment there.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/data
    environment:
      DATA_DIR: /data
      PORT: 3000
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-opencode-go/deepseek-v4-flash}
      OPENCODE_CHAT_MODEL: ${OPENCODE_CHAT_MODEL:-opencode-go/mimo-v2.5}
      # Z.ai GLM Coding Plan key — only needed for zai-coding-plan/* models.
      ZAI_API_KEY: ${ZAI_API_KEY:-}
